services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: mavic
      POSTGRES_PASSWORD: mavic
      POSTGRES_DB: mavic
    ports:
      - "5432:5432"
    volumes:
      - mavic_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mavic -d mavic"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  mavic_pg:
